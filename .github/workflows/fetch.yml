name: Fetch Race Data

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch:          # manual trigger from GitHub Actions tab
  push:
    paths:
      - 'config.json'         # reruns immediately when you change the race config

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read config and fetch
        run: |
          EVENT_ID=$(jq -r '.eventId' config.json)
          TRACK_ID=$(jq -r '.idTrack' config.json)
          RACE_NAME=$(jq -r '.raceName' config.json)
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "Event: $RACE_NAME  |  eventId=$EVENT_ID  idTrack=$TRACK_ID"

          if [ -z "$TRACK_ID" ] || [ "$TRACK_ID" = "null" ] || [ "$TRACK_ID" = "" ]; then
            echo '{"status":"waiting","message":"idTrack not set in config.json"}' > results.json
            exit 0
          fi

          curl -sf \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (compatible; SpartanTracker/1.0)" \
            "https://live.onlinesystem.cz/api/ResultsList/List/?searchText=&category=&eventId=${EVENT_ID}&idTrack=${TRACK_ID}&exportType=5&take=5000&skip=0&page=1&pageSize=5000&sort%5B0%5D%5Bfield%5D=OrA&sort%5B0%5D%5Bdir%5D=asc" \
            -o raw.json

          echo "{\"updated\":\"${TIMESTAMP}\",\"raceName\":\"${RACE_NAME}\",\"data\":$(cat raw.json)}" > results.json
          echo "Done — $(wc -c < results.json) bytes"

      - name: Commit and push
        run: |
          git config user.email "actions@github.com"
          git config user.name "Race Data Bot"
          git add results.json
          git diff --staged --quiet || git commit -m "Race data $(date -u +'%H:%M UTC')"
          git pull --rebase origin main
          git push
