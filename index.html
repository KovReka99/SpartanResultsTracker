<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Spartan STG – Bielsko-Biała 2026</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #111;
      color: #eee;
      font-size: 15px;
    }

    header {
      background: #b01020;
      padding: 12px 16px;
    }
    header h1 { font-size: 19px; font-weight: 800; color: #fff; }
    header p  { font-size: 13px; color: rgba(255,255,255,0.7); margin-top: 2px; }

    .status-bar {
      background: #1c1c1c;
      padding: 7px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #777;
      border-bottom: 1px solid #252525;
    }
    .btn-sm {
      background: #b01020; color: #fff; border: none;
      padding: 4px 12px; border-radius: 4px; font-size: 12px; cursor: pointer;
    }

    .section { padding: 14px 16px; }
    .section-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1.2px; color: #555; margin-bottom: 10px;
    }

    /* My team card */
    .my-card { border: 2px solid #b01020; border-radius: 8px; overflow: hidden; }
    .my-card-head {
      background: #b01020; padding: 10px 14px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .my-card-head .tname { font-weight: 800; font-size: 16px; }
    .my-card-head .tscore { font-weight: 700; font-size: 15px; }

    .mrow {
      display: flex; align-items: center;
      padding: 9px 14px; gap: 10px;
      border-bottom: 1px solid #1e1e1e;
      background: #181818;
    }
    .mrow:last-of-type { border-bottom: none; }
    .gbadge {
      width: 22px; height: 22px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 800; flex-shrink: 0;
    }
    .gbadge.M { background: #1a5fa0; }
    .gbadge.F { background: #9b1060; }
    .mname { flex: 1; font-size: 14px; }
    .mtime { font-family: 'Courier New', monospace; font-size: 14px; font-weight: 600; }
    .mtime.done { color: #4caf50; }
    .mtime.wait { color: #444; font-size: 12px; }
    .star { color: gold; font-size: 13px; margin-left: 3px; }
    .score-note { font-size: 11px; color: #555; padding: 6px 14px 10px; background: #181818; }

    /* Rankings */
    .rcard { border-radius: 8px; overflow: hidden; }
    .trow {
      display: flex; align-items: center;
      padding: 10px 14px; gap: 10px;
      border-bottom: 1px solid #1e1e1e;
      background: #181818; cursor: pointer;
    }
    .trow:last-of-type { border-bottom: none; }
    .trow.mine { background: #1f0d0d; border-left: 3px solid #b01020; }
    .rpos { width: 26px; font-size: 14px; font-weight: 700; text-align: center; flex-shrink: 0; color: #444; }
    .rpos.p1 { color: #ffd700; }
    .rpos.p2 { color: #c0c0c0; }
    .rpos.p3 { color: #cd7f32; }
    .rname { flex: 1; font-size: 13px; }
    .rscore { font-family: 'Courier New', monospace; font-size: 13px; font-weight: 700; }
    .rprog  { font-size: 11px; color: #444; min-width: 30px; text-align: right; }

    .tdetail { display: none; background: #141414; border-bottom: 1px solid #1e1e1e; }
    .tdetail.open { display: block; }
    .drow {
      display: flex; align-items: center;
      padding: 6px 14px 6px 50px; gap: 8px;
      font-size: 13px; color: #888;
      border-bottom: 1px solid #1a1a1a;
    }
    .drow:last-child { border-bottom: none; }
    .dtime { font-family: 'Courier New', monospace; margin-left: auto; color: #4caf50; }
    .dstar { color: gold; font-size: 11px; }

    .c-green  { color: #4caf50; }
    .c-orange { color: #ff9800; }
    .c-red    { color: #f44336; }
    .c-dim    { color: #444; }

    .info-box {
      background: #181818; border: 1px solid #2a2a2a; border-radius: 6px;
      padding: 16px; color: #777; font-size: 13px; text-align: center; line-height: 1.6;
    }
    .info-box b { color: #aaa; }
    .err-box {
      background: #2a1212; border: 1px solid #b01020; border-radius: 6px;
      padding: 12px; color: #f88; font-size: 13px; line-height: 1.6;
    }
  </style>
</head>
<body>

<header>
  <h1>Spartan STG Tracker</h1>
  <p>Bielsko-Biała Ultra &middot; 29 August 2026</p>
</header>

<div class="status-bar">
  <span id="status-text">Loading…</span>
  <button class="btn-sm" onclick="manualRefresh()">↻ Refresh</button>
</div>

<div class="section">
  <div class="section-title">My Team — STG-Dunakeszi 4+</div>
  <div id="my-team"><div class="info-box">Loading…</div></div>
</div>

<div class="section">
  <div class="section-title">All STG Teams <span id="team-count" style="font-weight:400;color:#555"></span></div>
  <div id="rankings"></div>
</div>

<script>
const MY_TEAM  = 'STG-Dunakeszi 4+';
const INTERVAL = 60;

let teams    = {};
let ticker   = null;
let countdown = INTERVAL;
let expanded  = new Set();

// ── Fetch from results.json (same domain, no CORS) ───────
async function fetchData() {
  // Cache-bust so we always get the latest version
  const r = await fetch(`./results.json?t=${Date.now()}`, {
    signal: AbortSignal.timeout(10000)
  });
  if (!r.ok) throw new Error(`HTTP ${r.status} loading results.json`);
  const json = await r.json();

  // File can be: plain array, {updated,data:[...]}, or {status,message}
  if (Array.isArray(json)) return { data: json, updated: null };
  if (json.status === 'waiting') return { data: [], updated: null, message: json.message };
  if (json.data)                 return { data: json.data, updated: json.updated || null };
  return { data: [], updated: null };
}

// ── Time helpers ─────────────────────────────────────────
const TIME_RE = /^\d{1,3}:\d{2}:\d{2}$/;

function parseSecs(s) {
  if (!s || !TIME_RE.test(s.trim())) return null;
  const [h, m, sec] = s.trim().split(':').map(Number);
  return h * 3600 + m * 60 + sec;
}

function fmtSecs(secs) {
  if (secs == null) return '—';
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = Math.floor(secs % 60);
  return `${h}:${pad(m)}:${pad(s)}`;
}

function pad(n) { return String(n).padStart(2, '0'); }

// ── Process entries ───────────────────────────────────────
function processEntries(raw) {
  const out = {};
  for (const e of raw) {
    const teamField = (e.Team || '').trim();
    const clubField = (e.Club || '').trim();
    const cat       = (e.C   || '').trim();

    const stgName = /^STG/i.test(teamField) ? teamField
                  : /^STG/i.test(clubField) ? clubField
                  : null;

    if (!stgName && !/STG/i.test(cat)) continue;

    const team = stgName || clubField || teamField || 'STG Unknown';
    const secs = parseSecs(e.Result);

    if (!out[team]) out[team] = [];
    out[team].push({
      name: (e.N || '').trim(),
      sex:  e.Sex === 'F' ? 'F' : 'M',
      bib:  e.Bib,
      time: secs != null ? e.Result.trim() : null,
      secs,
    });
  }
  for (const members of Object.values(out)) {
    members.sort((a, b) => (a.secs ?? Infinity) - (b.secs ?? Infinity));
  }
  return out;
}

// ── Team score ────────────────────────────────────────────
function calcScore(members) {
  const finished = members.filter(m => m.secs != null);
  const females  = finished.filter(m => m.sex === 'F');
  const total    = members.length;

  if (finished.length === 0)
    return { status: 'nodata',    score: null, scoring: [], finished, total };
  if (finished.length < 4)
    return { status: 'waiting',   score: null, scoring: [], finished, total };
  if (females.length === 0)
    return { status: 'no_female', score: null, scoring: [], finished, total };

  const top4 = finished.slice(0, 4);
  let scoring;
  if (top4.some(m => m.sex === 'F')) {
    scoring = top4;
  } else {
    scoring = [...top4.slice(0, 3), females[0]].sort((a, b) => a.secs - b.secs);
  }

  const avg = Math.round(scoring.reduce((s, m) => s + m.secs, 0) / 4);
  return { status: 'valid', score: avg, scoring, finished, total };
}

// ── Render: my team ───────────────────────────────────────
function renderMyTeam() {
  const el = document.getElementById('my-team');
  const members = teams[MY_TEAM];

  if (!members || members.length === 0) {
    el.innerHTML = `<div class="info-box">
      STG-Dunakeszi 4+ not in results yet.<br>
      Waiting for the first team member to finish.
    </div>`;
    return;
  }

  const { status, score, scoring, finished, total } = calcScore(members);
  const scoringBibs = new Set(scoring.map(m => m.bib));

  const scoreLbl = {
    valid:     `<span class="c-green">${fmtSecs(score)}</span>`,
    waiting:   `<span class="c-orange">⏳ ${finished.length}/${total} done</span>`,
    no_female: `<span class="c-red">⚠ No female finisher yet</span>`,
    nodata:    `<span class="c-dim">Waiting…</span>`,
  }[status];

  const rows = members.map(m => {
    const t = m.time
      ? `<span class="mtime done">${m.time}</span>`
      : `<span class="mtime wait">not finished</span>`;
    const s = scoringBibs.has(m.bib) ? '<span class="star">★</span>' : '';
    return `<div class="mrow">
      <div class="gbadge ${m.sex}">${m.sex}</div>
      <div class="mname">${esc(m.name)}</div>
      ${t}${s}
    </div>`;
  }).join('');

  const note = status === 'valid'
    ? `<div class="score-note">★ counted in team score &nbsp;·&nbsp; avg of best 4, ≥1 female</div>`
    : '';

  el.innerHTML = `<div class="my-card">
    <div class="my-card-head">
      <span class="tname">${esc(MY_TEAM)}</span>
      <span class="tscore">${scoreLbl}</span>
    </div>
    ${rows}${note}
  </div>`;
}

// ── Render: rankings ─────────────────────────────────────
function renderRankings() {
  const el = document.getElementById('rankings');
  const tc = document.getElementById('team-count');

  if (Object.keys(teams).length === 0) {
    el.innerHTML = '';
    tc.textContent = '';
    return;
  }

  const scored = Object.entries(teams)
    .map(([name, members]) => ({ name, ...calcScore(members) }))
    .sort((a, b) => {
      if (a.status === 'valid' && b.status === 'valid') return a.score - b.score;
      if (a.status === 'valid')   return -1;
      if (b.status === 'valid')   return  1;
      if (a.status === 'waiting' && b.status === 'waiting')
        return b.finished.length - a.finished.length;
      if (a.status === 'waiting') return -1;
      if (b.status === 'waiting') return  1;
      return a.name.localeCompare(b.name);
    });

  tc.textContent = `(${scored.length} teams)`;

  let validRank = 0;
  const html = scored.map((t, i) => {
    const isMe = t.name === MY_TEAM;
    if (t.status === 'valid') validRank++;

    const posNum   = t.status === 'valid' ? validRank : '—';
    const posClass = validRank <= 3 && t.status === 'valid' ? `p${validRank}` : '';

    const scoreTxt = t.status === 'valid'
      ? `<span class="rscore c-green">${fmtSecs(t.score)}</span>`
      : t.status === 'no_female'
      ? `<span class="rscore c-red">⚠</span>`
      : `<span class="rscore c-dim">—</span>`;

    const detailId = `d${i}`;
    const isOpen   = expanded.has(detailId);

    const scoringBibs = new Set(t.scoring.map(m => m.bib));
    const detailRows  = t.finished.map(m => `
      <div class="drow">
        <div class="gbadge ${m.sex}" style="width:16px;height:16px;font-size:8px">${m.sex}</div>
        ${esc(m.name)}
        <span class="dtime">${m.time}</span>
        ${scoringBibs.has(m.bib) ? '<span class="dstar">★</span>' : ''}
      </div>`).join('');

    return `
      <div class="trow${isMe ? ' mine' : ''}" onclick="toggleDetail('${detailId}')">
        <div class="rpos ${posClass}">${posNum}</div>
        <div class="rname">${isMe ? '★ ' : ''}${esc(t.name)}</div>
        ${scoreTxt}
        <span class="rprog">${t.finished.length}/${t.total}</span>
      </div>
      <div id="${detailId}" class="tdetail${isOpen ? ' open' : ''}">${detailRows}</div>`;
  }).join('');

  el.innerHTML = `<div class="rcard">${html}</div>`;
}

function toggleDetail(id) {
  if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
  const el = document.getElementById(id);
  if (el) el.classList.toggle('open');
}

// ── Status ────────────────────────────────────────────────
function setStatus(msg) { document.getElementById('status-text').textContent = msg; }

function updateStatus(updatedAt) {
  const finishers = Object.values(teams).reduce((s, m) => s + m.filter(x => x.secs).length, 0);
  const age = updatedAt ? ` · data from ${updatedAt}` : '';
  setStatus(`${finishers} finishers · refresh in ${countdown}s${age}`);
}

// ── Refresh ───────────────────────────────────────────────
let lastUpdated = null;

async function refresh() {
  setStatus('Loading…');
  try {
    const { data, updated, message } = await fetchData();
    lastUpdated = updated || lastUpdated;

    if (data.length === 0 && message) {
      setStatus('Race not started yet — track ID not configured');
      document.getElementById('my-team').innerHTML = `<div class="info-box">
        <b>Race data not configured yet.</b><br><br>
        On race morning: open the GitHub workflow file and replace <b>XXXXX</b>
        with the track ID from live.onlinesystem.cz.
      </div>`;
      document.getElementById('rankings').innerHTML = '';
      document.getElementById('team-count').textContent = '';
      return;
    }

    teams = processEntries(data);
    const stgCount = Object.keys(teams).length;

    if (stgCount === 0 && data.length > 0) {
      setStatus(`Loaded ${data.length} entries — no STG teams found`);
      document.getElementById('my-team').innerHTML = `<div class="info-box">
        Loaded ${data.length} results but found no STG teams.<br>
        Check that the workflow has the correct STG track ID.
      </div>`;
      document.getElementById('rankings').innerHTML = '';
      return;
    }

    renderMyTeam();
    renderRankings();
    countdown = INTERVAL;
    updateStatus(lastUpdated);
    startTicker();
  } catch (e) {
    setStatus(`Error loading data`);
    document.getElementById('my-team').innerHTML = `<div class="err-box">
      <b>Could not load results.json</b><br><br>${esc(e.message)}
    </div>`;
  }
}

async function manualRefresh() {
  if (ticker) { clearInterval(ticker); ticker = null; }
  await refresh();
}

function startTicker() {
  if (ticker) clearInterval(ticker);
  countdown = INTERVAL;
  ticker = setInterval(() => {
    countdown--;
    if (countdown <= 0) refresh();
    else updateStatus(lastUpdated);
  }, 1000);
}

function esc(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

refresh();
</script>
</body>
</html>
